<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Connect | Private</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: 'Quicksand', sans-serif; 
            background: #f8fafc;
            height: 100vh;
            overflow: hidden;
            color: #1e293b;
            touch-action: manipulation;
        }

        /* Optimized Background */
        .bg-glow {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at 10% 20%, rgba(219, 234, 254, 0.8) 0%, transparent 50%),
                        radial-gradient(circle at 90% 80%, rgba(251, 207, 232, 0.8) 0%, transparent 50%);
            z-index: -1;
        }

        /* High Performance Glass */
        .glass { 
            background: rgba(255, 255, 255, 0.8); 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            transform: translateZ(0); /* Forces GPU usage for smoothness */
        }

        /* Pulse for Ringing */
        .ring-pulse {
            animation: pulse-ring 1.8s infinite;
        }
        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); }
            70% { box-shadow: 0 0 0 20px rgba(59, 130, 246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }

        .hold-active {
            background: #fff7ed !important;
            border-color: #fb923c !important;
            color: #ea580c !important;
        }

        input:focus { transform: translateY(-2px); }
        button:active { transform: scale(0.96); }
        .transition-smooth { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <div class="bg-glow"></div>

    <div id="login-section" class="glass p-8 rounded-[2rem] w-full max-w-sm text-center transition-smooth">
        <h1 class="text-2xl font-bold mb-6 tracking-tight">Private Connect</h1>
        <div class="space-y-4">
            <input id="username" type="text" placeholder="User" class="w-full p-4 rounded-xl bg-white/50 outline-none border border-transparent focus:border-blue-300 transition-smooth">
            <input id="password" type="password" placeholder="Key" class="w-full p-4 rounded-xl bg-white/50 outline-none border border-transparent focus:border-blue-300 transition-smooth">
            <button onclick="login()" class="bg-blue-600 text-white w-full py-4 rounded-xl font-bold shadow-lg shadow-blue-100 transition-smooth">Join</button>
        </div>
    </div>

    <div id="main-section" class="hidden glass p-10 rounded-[2.5rem] w-full max-w-xs text-center transition-smooth">
        <h2 id="welcome-msg" class="text-2xl font-bold mb-2"></h2>
        <p class="text-slate-400 text-sm mb-10">Status: Secure</p>
        <button onclick="initiateCall()" class="bg-green-500 p-7 rounded-full shadow-xl shadow-green-100 animate-bounce">
            <svg class="w-10 h-10 fill-white" viewBox="0 0 24 24"><path d="M20 15.5c-1.2 0-2.4-.2-3.6-.6-.3-.1-.7 0-1 .2l-2.2 2.2c-2.8-1.4-5.1-3.8-6.6-6.6l2.2-2.2c.3-.3.4-.7.2-1-.3-1.1-.5-2.3-.5-3.5 0-.6-.4-1-1-1H4c-.6 0-1 .4-1 1 0 9.4 7.6 17 17 17 .6 0 1-.4 1-1v-3.5c0-.6-.4-1-1-1z"/></svg>
        </button>
    </div>

    <div id="call-overlay" class="hidden fixed inset-0 bg-white/90 backdrop-blur-lg flex flex-col items-center justify-center z-50">
        <div class="relative mb-8">
            <div id="ring-glow" class="w-32 h-32 rounded-full bg-blue-50 flex items-center justify-center ring-pulse transition-smooth">
                <span id="remote-initial" class="text-5xl font-bold text-blue-600">?</span>
            </div>
        </div>
        <h3 id="remote-user-name" class="text-2xl font-bold text-slate-800 uppercase tracking-widest">User</h3>
        <p id="call-timer" class="text-blue-500 font-bold mt-2">Calling...</p>
        
        <div class="flex gap-8 mt-16">
            <button id="hold-btn" onclick="toggleHold()" class="w-16 h-16 rounded-full glass flex items-center justify-center transition-smooth">
                <svg class="w-6 h-6 fill-slate-600" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>
            <button onclick="endCall()" class="w-16 h-16 rounded-full bg-red-500 flex items-center justify-center shadow-lg shadow-red-200">
                <svg class="w-8 h-8 fill-white" viewBox="0 0 24 24"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08a.984.984 0 0 1-.29-.7c0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28-.79-.74-1.69-1.36-2.67-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/></svg>
            </button>
        </div>
        <audio id="remoteAudio" autoplay></audio>
    </div>

    <div id="incoming-popup" class="hidden fixed top-4 inset-x-4 glass p-6 rounded-2xl shadow-xl z-[60] border-t-4 border-green-500 transition-smooth">
        <div class="flex items-center justify-between mb-4">
            <span id="incoming-text" class="font-bold text-lg"></span>
            <span class="text-xs font-bold text-green-500 animate-pulse">INCOMING CALL</span>
        </div>
        <div class="flex gap-3">
            <button onclick="acceptCall()" class="flex-1 bg-green-500 py-3 rounded-xl text-white font-bold">Accept</button>
            <button onclick="rejectCall()" class="flex-1 bg-slate-100 py-3 rounded-xl text-slate-500 font-bold">Ignore</button>
        </div>
    </div>

    <script>
        const socket = io();
        let myUser = "", targetUser = "", pc = null, localStream = null, isHold = false;
        const config = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

        function login() {
            const user = document.getElementById('username').value.trim().toLowerCase();
            const pass = document.getElementById('password').value;
            if(user && pass) {
                document.getElementById('login-section').style.opacity = "0";
                setTimeout(() => socket.emit('login', { username: user, password: pass }), 300);
            }
        }

        socket.on('login_success', (data) => {
            myUser = data.username;
            targetUser = (myUser === "pratham") ? "adhya" : "pratham";
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('main-section').classList.remove('hidden');
            document.getElementById('welcome-msg').innerText = `Hi ${myUser.charAt(0).toUpperCase() + myUser.slice(1)}`;
            document.getElementById('remote-initial').innerText = targetUser.charAt(0).toUpperCase();
        });

        async function initiateCall() {
            document.getElementById('call-overlay').classList.remove('hidden');
            document.getElementById('call-timer').innerText = "Ringing...";
            socket.emit('call_user', { caller: myUser, target: targetUser });
        }

        socket.on('incoming_call', (data) => {
            document.getElementById('incoming-popup').classList.remove('hidden');
            document.getElementById('incoming-text').innerText = data.from.toUpperCase();
        });

        async function acceptCall() {
            document.getElementById('incoming-popup').classList.add('hidden');
            document.getElementById('call-overlay').classList.remove('hidden');
            document.getElementById('call-timer').innerText = "Connecting...";
            await setupWebRTC(true);
        }

        async function setupWebRTC(isInitiator) {
            if(pc) return;
            pc = new RTCPeerConnection(config);
            pc.oniceconnectionstatechange = () => {
                const timer = document.getElementById('call-timer');
                if (pc.iceConnectionState === 'connected') {
                    timer.innerText = "Connected";
                    timer.className = "text-green-500 font-bold mt-2";
                    document.getElementById('ring-glow').classList.remove('ring-pulse');
                }
            };

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
            } catch (err) {
                alert("Please enable mic.");
                resetCallUI();
                return;
            }

            pc.ontrack = e => { document.getElementById('remoteAudio').srcObject = e.streams[0]; };
            pc.onicecandidate = e => { if(e.candidate) socket.emit('signal', { candidate: e.candidate, target: targetUser }); };

            if (isInitiator) {
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                socket.emit('signal', { offer: offer, target: targetUser });
            }
        }

        socket.on('signal', async (data) => {
            if (data.offer) {
                if (!pc) await setupWebRTC(false);
                await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                socket.emit('signal', { answer: answer, target: targetUser });
            } else if (data.answer) {
                if(pc) await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
            } else if (data.candidate) {
                if(pc) await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
            }
        });

        function toggleHold() {
            if(!localStream) return;
            isHold = !isHold;
            localStream.getAudioTracks()[0].enabled = !isHold;
            document.getElementById('remoteAudio').muted = isHold;

            const timer = document.getElementById('call-timer');
            const holdBtn = document.getElementById('hold-btn');
            
            if (isHold) {
                timer.innerText = "On Hold";
                timer.className = "text-orange-500 font-bold mt-2";
                holdBtn.classList.add('hold-active');
            } else {
                timer.innerText = "Connected";
                timer.className = "text-green-500 font-bold mt-2";
                holdBtn.classList.remove('hold-active');
            }
            socket.emit('call_action', { action: 'hold', status: isHold, target: targetUser });
        }

        socket.on('call_action_received', (data) => {
            const timer = document.getElementById('call-timer');
            const remoteAudio = document.getElementById('remoteAudio');
            if (data.action === 'hold') {
                if (data.status) {
                    timer.innerText = "Partner on hold";
                    timer.className = "text-orange-500 font-bold mt-2";
                    remoteAudio.muted = true;
                } else {
                    timer.innerText = "Connected";
                    timer.className = "text-green-500 font-bold mt-2";
                    remoteAudio.muted = false;
                }
            } else if (data.action === 'cut') {
                resetCallUI();
            }
        });

        function endCall() {
            socket.emit('call_action', { action: 'cut', target: targetUser });
            resetCallUI();
        }

        function rejectCall() {
            socket.emit('call_action', { action: 'cut', target: targetUser });
            document.getElementById('incoming-popup').classList.add('hidden');
        }

        function resetCallUI() {
            if(pc) { pc.close(); pc = null; }
            if(localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
            document.getElementById('remoteAudio').srcObject = null;
            document.getElementById('remoteAudio').muted = false;
            document.getElementById('call-overlay').classList.add('hidden');
            document.getElementById('incoming-popup').classList.add('hidden');
            document.getElementById('ring-glow').classList.add('ring-pulse');
            document.getElementById('hold-btn').classList.remove('hold-active');
            const timer = document.getElementById('call-timer');
            timer.className = "text-blue-500 font-bold mt-2";
            timer.innerText = "Calling...";
            isHold = false;
        }
    </script>
</body>
</html>
