
Conversation with Gemini
<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Private Connect | Pratham & Adhya</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">

   

    <style>

        body {

            font-family: 'Quicksand', sans-serif;

            background: linear-gradient(135deg, #fce7f3 0%, #e0e7ff 50%, #f0f9ff 100%);

            height: 100vh;

            overflow: hidden;

            color: #1e293b;

        }



        /* Fluid Background Animations */

        .blob {

            position: absolute;

            width: 600px;

            height: 600px;

            background: radial-gradient(circle, rgba(192, 132, 252, 0.3) 0%, rgba(255, 255, 255, 0) 70%);

            filter: blur(100px);

            z-index: -1;

            animation: move 25s infinite alternate ease-in-out;

        }

        @keyframes move {

            0% { transform: translate(-10%, -10%) scale(1); }

            100% { transform: translate(20%, 20%) scale(1.2); }

        }



        /* Glassmorphism Effect */

        .glass {

            background: rgba(255, 255, 255, 0.65);

            backdrop-filter: blur(25px);

            border: 1px solid rgba(255, 255, 255, 0.4);

            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08);

            transition: all 0.4s ease-in-out;

        }



        /* Ringing Pulse Animation */

        .ring-pulse {

            animation: pulse-ring 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;

        }

        @keyframes pulse-ring {

            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); }

            70% { transform: scale(1); box-shadow: 0 0 0 25px rgba(59, 130, 246, 0); }

            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }

        }



        /* Popup Slide In Animation */

        .slide-in {

            animation: slideIn 0.4s ease-out forwards;

        }

        @keyframes slideIn {

            from { transform: translateX(120%); opacity: 0; }

            to { transform: translateX(0); opacity: 1; }

        }

    </style>

</head>

<body class="flex items-center justify-center relative">



    <div class="blob" style="top: -150px; left: -150px;"></div>

    <div class="blob" style="bottom: -150px; right: -150px; background: radial-gradient(circle, rgba(147, 197, 253, 0.3) 0%, rgba(255, 255, 255, 0) 70%);"></div>



    <div id="login-section" class="glass p-10 rounded-[2.5rem] w-full max-w-sm text-center mx-4 transition-all duration-500">

        <h1 class="text-3xl font-bold mb-1 tracking-tight">Private Connect</h1>

        <p class="text-slate-500 mb-8 text-sm font-medium">Exclusive Access</p>

        <div class="space-y-4">

            <input id="username" type="text" placeholder="Username" class="w-full p-4 rounded-2xl bg-white/50 border-none outline-none focus:ring-2 ring-blue-300 transition-all font-semibold">

            <input id="password" type="password" placeholder="Password" class="w-full p-4 rounded-2xl bg-white/50 border-none outline-none focus:ring-2 ring-blue-300 transition-all font-semibold">

            <button onclick="login()" class="bg-gradient-to-r from-blue-500 to-indigo-500 hover:from-blue-600 hover:to-indigo-600 text-white w-full py-4 rounded-2xl font-bold transition-all shadow-xl shadow-blue-200 active:scale-95">Enter</button>

        </div>

    </div>



    <div id="main-section" class="hidden glass p-10 rounded-[3rem] w-full max-w-md text-center mx-4 transition-all duration-500">

        <h2 id="welcome-msg" class="text-3xl font-bold mb-2 text-slate-800"></h2>

        <p class="text-slate-500 text-sm mb-12 font-medium" id="status-display">Ready for a secure call</p>

        <div class="relative flex justify-center">

            <button onclick="initiateCall()" class="bg-gradient-to-tr from-green-400 to-emerald-500 p-8 rounded-full hover:scale-110 transition-all shadow-2xl shadow-emerald-200 active:scale-90 group">

                <svg class="w-12 h-12 fill-white group-hover:rotate-12 transition-transform" viewBox="0 0 24 24"><path d="M20 15.5c-1.2 0-2.4-.2-3.6-.6-.3-.1-.7 0-1 .2l-2.2 2.2c-2.8-1.4-5.1-3.8-6.6-6.6l2.2-2.2c.3-.3.4-.7.2-1-.3-1.1-.5-2.3-.5-3.5 0-.6-.4-1-1-1H4c-.6 0-1 .4-1 1 0 9.4 7.6 17 17 17 .6 0 1-.4 1-1v-3.5c0-.6-.4-1-1-1z"/></svg>

            </button>

        </div>

    </div>



    <div id="call-overlay" class="hidden fixed inset-0 bg-white/70 backdrop-blur-2xl flex flex-col items-center justify-center z-50 transition-opacity duration-300">

        <div class="relative mb-12">

            <div id="ring-glow" class="w-44 h-44 rounded-full bg-white flex items-center justify-center border-8 border-white shadow-2xl overflow-hidden ring-pulse">

                <span id="remote-initial" class="text-7xl font-bold bg-gradient-to-br from-blue-400 to-indigo-600 bg-clip-text text-transparent">?</span>

            </div>

        </div>

        <h3 id="remote-user-name" class="text-4xl font-extrabold mb-2 text-slate-800 uppercase tracking-tighter">User</h3>

        <p id="call-timer" class="text-blue-500 font-bold text-lg tracking-widest uppercase transition-colors">Calling...</p>

       

        <div class="flex gap-10 mt-24">

            <button id="hold-btn" onclick="toggleHold()" class="w-20 h-20 rounded-full glass flex items-center justify-center hover:bg-white transition-all shadow-xl group">

                <svg class="w-8 h-8 fill-slate-500 group-hover:fill-orange-400 transition-colors" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>

            </button>

            <button onclick="endCall()" class="w-20 h-20 rounded-full bg-gradient-to-tr from-rose-400 to-red-600 flex items-center justify-center hover:scale-110 transition-all shadow-2xl shadow-red-200 active:scale-90">

                <svg class="w-10 h-10 fill-white" viewBox="0 0 24 24"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08a.984.984 0 0 1-.29-.7c0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28-.79-.74-1.69-1.36-2.67-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/></svg>

            </button>

        </div>

        <audio id="remoteAudio" autoplay></audio>

    </div>



    <div id="incoming-popup" class="hidden fixed top-8 right-8 glass p-8 rounded-[2.5rem] shadow-2xl border-l-8 border-green-400 w-80 z-[60] slide-in">

        <div class="flex items-center gap-5 mb-6">

            <div class="w-14 h-14 bg-green-100 rounded-2xl flex items-center justify-center animate-bounce">

                <svg class="w-8 h-8 fill-green-500" viewBox="0 0 24 24"><path d="M20 15.5c-1.2 0-2.4-.2-3.6-.6-.3-.1-.7 0-1 .2l-2.2 2.2c-2.8-1.4-5.1-3.8-6.6-6.6l2.2-2.2c.3-.3.4-.7.2-1-.3-1.1-.5-2.3-.5-3.5 0-.6-.4-1-1-1H4c-.6 0-1 .4-1 1 0 9.4 7.6 17 17 17 .6 0 1-.4 1-1v-3.5c0-.6-.4-1-1-1z"/></svg>

            </div>

            <div>

                <p id="incoming-text" class="font-bold text-slate-800 text-lg uppercase tracking-tight"></p>

                <p class="text-xs text-slate-400 font-bold tracking-widest uppercase">is calling you</p>

            </div>

        </div>

        <div class="flex gap-4">

            <button onclick="acceptCall()" class="flex-1 bg-green-500 py-3 rounded-xl text-white font-bold hover:bg-green-600 transition-all shadow-lg active:scale-95">Accept</button>

            <button onclick="rejectCall()" class="flex-1 bg-slate-200 py-3 rounded-xl text-slate-600 font-bold hover:bg-slate-300 transition-all active:scale-95">Decline</button>

        </div>

    </div>



    <script>

        const socket = io();

        let myUser = "", targetUser = "", pc = null, localStream = null, isHold = false;

       

        // Google's free STUN server for WebRTC

        const config = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };



        // --- 1. Authentication ---

        function login() {

            const user = document.getElementById('username').value.trim().toLowerCase();

            const pass = document.getElementById('password').value;

            if(user && pass) {

                // Smooth hide login

                document.getElementById('login-section').style.opacity = "0";

                setTimeout(() => socket.emit('login', { username: user, password: pass }), 300);

            }

        }



        socket.on('login_success', (data) => {

            myUser = data.username;

            targetUser = (myUser === "pratham") ? "adhya" : "pratham";

           

            document.getElementById('login-section').classList.add('hidden');

            document.getElementById('main-section').classList.remove('hidden');

           

            document.getElementById('welcome-msg').innerText = `Hello, ${myUser.charAt(0).toUpperCase() + myUser.slice(1)}!`;

            document.getElementById('remote-initial').innerText = targetUser.charAt(0).toUpperCase();

        });



        // --- 2. Call Initiation & Receiving ---

        async function initiateCall() {

            document.getElementById('call-overlay').classList.remove('hidden');

            document.getElementById('remote-user-name').innerText = targetUser;

            document.getElementById('call-timer').innerText = "Ringing...";

           

            // Tell backend to ring the target user

            socket.emit('call_user', { caller: myUser, target: targetUser });

        }



        socket.on('incoming_call', (data) => {

            document.getElementById('incoming-popup').classList.remove('hidden');

            document.getElementById('incoming-text').innerText = data.from;

        });



        // --- 3. WebRTC Setup (Triggers ONLY on Accept) ---

        async function acceptCall() {

            document.getElementById('incoming-popup').classList.add('hidden');

            document.getElementById('call-overlay').classList.remove('hidden');

            document.getElementById('remote-user-name').innerText = targetUser;

            document.getElementById('call-timer').innerText = "Connecting...";

           

            // Receiver starts the WebRTC offer

            await setupWebRTC(true);

        }



        async function setupWebRTC(isInitiator) {

            if(pc) return; // Prevent duplicate connections

           

            pc = new RTCPeerConnection(config);

           

            // Connection State Management

            pc.oniceconnectionstatechange = () => {

                const timer = document.getElementById('call-timer');

                if (pc.iceConnectionState === 'connected') {

                    timer.innerText = "Connected";

                    timer.className = "text-green-500 font-bold text-lg tracking-widest uppercase transition-colors";

                    document.getElementById('ring-glow').classList.remove('ring-pulse');

                } else if (pc.iceConnectionState === 'disconnected' || pc.iceConnectionState === 'failed') {

                    resetCallUI();

                }

            };



            // Get Microphone Access

            try {

                localStream = await navigator.mediaDevices.getUserMedia({ audio: true });

                localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

            } catch (err) {

                alert("Please allow microphone access to make the call.");

                resetCallUI();

                return;

            }



            // Play remote audio when received

            pc.ontrack = e => {

                document.getElementById('remoteAudio').srcObject = e.streams[0];

            };



            // Exchange ICE candidates

            pc.onicecandidate = e => {

                if(e.candidate) socket.emit('signal', { candidate: e.candidate, target: targetUser });

            };



            // Create Offer (Only the one who clicked Accept does this)

            if (isInitiator) {

                const offer = await pc.createOffer();

                await pc.setLocalDescription(offer);

                socket.emit('signal', { offer: offer, target: targetUser });

            }

        }



        // --- 4. Signaling Logic ---

        socket.on('signal', async (data) => {

            if (data.offer) {

                // Caller receives the offer and sets up their end

                if (!pc) await setupWebRTC(false);

                await pc.setRemoteDescription(new RTCSessionDescription(data.offer));

                const answer = await pc.createAnswer();

                await pc.setLocalDescription(answer);

                socket.emit('signal', { answer: answer, target: targetUser });

            } else if (data.answer) {

                // Receiver gets the answer

                if(pc) await pc.setRemoteDescription(new RTCSessionDescription(data.answer));

            } else if (data.candidate) {

                // Exchange candidates

                if(pc) await pc.addIceCandidate(new RTCIceCandidate(data.candidate));

            }

        });



        // --- 5. Call Controls (Hold/Cut) ---

        function toggleHold() {

            if(!localStream) return;

           

            isHold = !isHold;

            localStream.getAudioTracks()[0].enabled = !isHold; // Mute/Unmute mic

           

            const timer = document.getElementById('call-timer');

            timer.innerText = isHold ? "Call on Hold" : "Connected";

            timer.className = isHold ? "text-orange-400 font-bold text-lg tracking-widest uppercase transition-colors" : "text-green-500 font-bold text-lg tracking-widest uppercase transition-colors";

           

            // Sync with partner

            socket.emit('call_action', { action: 'hold', status: isHold, target: targetUser });

        }



        socket.on('call_action_received', (data) => {

            const timer = document.getElementById('call-timer');

            if (data.action === 'hold') {

                timer.innerText = data.status ? "Partner on hold" : "Connected";

                timer.className = data.status ? "text-orange-400 font-bold text-lg tracking-widest uppercase transition-colors" : "text-green-500 font-bold text-lg tracking-widest uppercase transition-colors";

            } else if (data.action === 'cut') {

                resetCallUI();

            }

        });



        function endCall() {

            socket.emit('call_action', { action: 'cut', target: targetUser });

            resetCallUI();

        }



        function rejectCall() {

            socket.emit('call_action', { action: 'cut', target: targetUser });

            document.getElementById('incoming-popup').classList.add('hidden');

        }



        function resetCallUI() {

            // Clean up WebRTC completely

            if(pc) {

                pc.close();

                pc = null;

            }

            if(localStream) {

                localStream.getTracks().forEach(t => t.stop());

                localStream = null;

            }

           

            document.getElementById('remoteAudio').srcObject = null;

           

            // Reset UI elements

            document.getElementById('call-overlay').classList.add('hidden');

            document.getElementById('incoming-popup').classList.add('hidden');

            document.getElementById('ring-glow').classList.add('ring-pulse');

           

            const timer = document.getElementById('call-timer');

            timer.className = "text-blue-500 font-bold text-lg tracking-widest uppercase transition-colors";

            timer.innerText = "Calling...";

           

            isHold = false;

        }

    </script>

</body>

</html>
